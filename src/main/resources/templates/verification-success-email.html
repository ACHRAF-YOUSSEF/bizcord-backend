<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account verified — Bizcord</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .container { max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #16a34a, #14532d); padding: 36px 40px; text-align: center; }
    .header h1 { margin: 12px 0 0; color: #ffffff; font-size: 22px; font-weight: 700; }
    .header p { margin: 4px 0 0; color: #86efac; font-size: 13px; }
    .body { padding: 36px 40px; text-align: center; }
    .body h2 { margin: 0 0 12px; color: #18181b; font-size: 18px; text-align: left; }
    .body p { margin: 0 0 16px; color: #52525b; font-size: 15px; line-height: 1.6; text-align: left; }
    .checkmark { font-size: 48px; text-align: center; margin: 8px 0 24px; }
    .btn-wrap { text-align: center; margin: 28px 0; }
    .btn { display: inline-block; padding: 14px 32px; background: #16a34a; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; }
    .footer { padding: 20px 40px; text-align: center; border-top: 1px solid #f4f4f5; }
    .footer p { margin: 0; color: #a1a1aa; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>You're verified!</h1>
      <p>Your Bizcord account is now active</p>
    </div>
    <div class="body">
      <div class="checkmark"></div>
      <h2>Welcome, <span th:text="${username}">there</span>!</h2>
      <p>Your email has been verified and your account is now fully activated. You can now sign in and start collaborating with your team.</p>
      <div class="btn-wrap">
        <a th:href="${loginUrl}" class="btn">Sign in to Bizcord</a>
      </div>
    </div>
    <div class="footer">
      <p>© Bizcord — Where teams get work done</p>
    </div>
  </div>
</body>
</html>
