spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  config:
    activate:
      on-profile: prod

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://bizcord.achrafyoussef.tech}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600
  upload:
    base-directory: ${APP_UPLOAD_BASE_DIRECTORY:uploads}
    public-base-path: ${APP_UPLOAD_PUBLIC_BASE_PATH:/uploads}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
    same-site: Strict
    path: /api/auth
    max-age: 604800
  jwt:
    secret-key: ${APP_JWT_SECRET_KEY}
    access-token-expiry-ms: 900000
  mediasoup:
    url: ${MEDIASOUP_URL:http://mediasoup:3000}
    api-secret: ${MEDIASOUP_API_SECRET:bizcord-mediasoup-secret}