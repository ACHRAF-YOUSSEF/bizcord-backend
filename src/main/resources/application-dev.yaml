spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bizcord
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  config:
    activate:
      on-profile: dev

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600
  upload:
    base-directory: uploads
    public-base-path: /uploads
  cookie:
    secure: false
    same-site: Strict
    path: /api/auth
    max-age: 604800
  jwt:
    secret-key: ${APP_JWT_SECRET_KEY:597133743677397A24432646294A404E635266556A586E5A7234753778214125}
    access-token-expiry-ms: 900000