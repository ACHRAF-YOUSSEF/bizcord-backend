spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bizcord
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  config:
    activate:
      on-profile: dev

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600
  storage:
    public-base-path: /uploads
    minio:
      endpoint: ${APP_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${APP_STORAGE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${APP_STORAGE_MINIO_SECRET_KEY:minioadmin}
      bucket: ${APP_STORAGE_MINIO_BUCKET:bizcord}
      secure: ${APP_STORAGE_MINIO_SECURE:false}
  cookie:
    secure: false
    same-site: Strict
    path: /api/auth
    max-age: 604800
  jwt:
    secret-key: ${APP_JWT_SECRET_KEY:app-jwt-secret-key}
    access-token-expiry-ms: 900000
  mediasoup:
    url: http://localhost:3000
    api-secret: ${API_SECRET:bizcord-mediasoup-secret}
