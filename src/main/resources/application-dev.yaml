spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bizcord}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  config:
    activate:
      on-profile: dev

  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025
    protocol: smtp
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail:
    from: noreply@bizcord.local
  cors:
    allowed-origin-patterns:
      - ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600
  storage:
    public-base-path: ${APP_STORAGE_PUBLIC_BASE_PATH:/api/uploads}
    minio:
      endpoint: ${APP_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${APP_STORAGE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${APP_STORAGE_MINIO_SECRET_KEY:minioadmin}
      bucket: ${APP_STORAGE_MINIO_BUCKET:bizcord}
      secure: ${APP_STORAGE_MINIO_SECURE:false}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: Strict
    path: /api/auth
    max-age: 604800
  jwt:
    secret-key: ${APP_JWT_SECRET_KEY:app-jwt-secret-key}
    access-token-expiry-ms: 900000
  mediasoup:
    url: ${MEDIASOUP_URL:http://localhost:3000}
    api-secret: ${MEDIASOUP_API_SECRET:bizcord-mediasoup-secret}
