spring:
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  config:
    import: file:.env[.properties]
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  application:
    name: Bizcord-Backend
  profiles:
    default: dev
  jpa:
    open-in-view: false