spring:
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  config:
    import: file:.env[.properties]
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  application:
    name: Bizcord-Backend
  profiles:
    default: dev
  jpa:
    open-in-view: false