services:
  postgres:
    image: postgres:18-alpine3.23
    container_name: bizcord-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bizcord
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bizcord" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bizcord-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./minio_data:/data
    expose:
      - "9000"
      - "9001"

  minio-init:
    image: minio/mc:latest
    container_name: bizcord-minio-init
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin} ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
        mc mb --ignore-existing local/${APP_STORAGE_MINIO_BUCKET:-bizcord}

  backend:
    image: achrafyoussef/bizcord-backend:latest
    container_name: bizcord-backend
    restart: unless-stopped
    depends_on:
      mediasoup:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      DB_URL: jdbc:postgresql://postgres:5432/bizcord
      DB_USERNAME: admin
      DB_PASSWORD: admin
      API_SECRET: ${APP_API_SECRET:-bizcord-api-secret}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:-bizcord-secret-key}
      APP_MEDIASOUP_API_SECRET: ${MEDIASOUP_API_SECRET:-bizcord-mediasoup-secret}
      APP_MEDIASOUP_URL: ${MEDIASOUP_URL:-http://192.168.0.224:3000}
      APP_STORAGE_MINIO_ENDPOINT: ${APP_STORAGE_MINIO_ENDPOINT:-http://minio:9000}
      APP_STORAGE_MINIO_ACCESS_KEY: ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      APP_STORAGE_MINIO_SECRET_KEY: ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
      APP_STORAGE_MINIO_BUCKET: ${APP_STORAGE_MINIO_BUCKET:-bizcord}
      APP_STORAGE_MINIO_SECURE: ${APP_STORAGE_MINIO_SECURE:-false}
      APP_STORAGE_PUBLIC_BASE_PATH: ${APP_STORAGE_PUBLIC_BASE_PATH:-/api/uploads}
    expose:
      - "8080"

  mediasoup:
    image: achrafyoussef/bizcord-mediasoup:latest
    container_name: bizcord-mediasoup
    restart: unless-stopped
    environment:
      PORT: 3000
      LISTEN_IP: 0.0.0.0
      ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-52000}
      RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-52999}
      API_SECRET: ${MEDIASOUP_API_SECRET:-bizcord-mediasoup-secret}
    network_mode: "host"

  frontend:
    image: achrafyoussef/bizcord-frontend:latest
    container_name: bizcord-frontend
    environment:
      BACKEND_URL: http://bizcord-backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"
