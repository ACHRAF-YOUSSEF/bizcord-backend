services:
  postgres:
    image: postgres:17.9-alpine3.23
    container_name: bizcord-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bizcord
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bizcord" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: achrafyoussef/bizcord-backend:latest
    container_name: bizcord-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:8080"
      DB_URL: jdbc:postgresql://postgres:5432/bizcord
      DB_USERNAME: admin
      DB_PASSWORD: admin
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8080"

  frontend:
    image: achrafyoussef/bizcord-frontend:latest
    container_name: bizcord-frontend
    environment:
      BACKEND_URL: http://bizcord-backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"